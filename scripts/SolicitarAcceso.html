<script>
  // ==================== Solicitar acceso a más propiedades (cuenta ya registrada) ====================
  // Entradas: opción "Solicitar acceso" del menú del usuario, bloque "Mis accesos" del Perfil y el aviso del Inicio cuando la
  // persona no tiene ninguna propiedad. Todas abren el mismo panel lateral. El backend es backend/MisAccesos.js; lo pedido lo
  // resuelve el administrador de cada propiedad desde "Usuarios" (mismo circuito del registro).

  var ICONO_PROPIEDAD_ACCESO_ = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-5h6v5"/></svg>';

  function esSuperadminSesion_() {
    const s = getCurrentUserSession();
    return !!s && (String(s.Rol || '').toLowerCase() === 'superadministrador' || String(s.ID_Rol || s.Rol_ID || '') === '3');
  }

  /** Muestra u oculta el aviso del Inicio: aparece solo si la persona no tiene ninguna propiedad (y no es superadmin). */
  function actualizarAvisoSinPropiedades_(modulos) {
    const aviso = document.getElementById('avisoSinPropiedades');
    if (!aviso) return;
    const total = (modulos || []).reduce(function (n, m) { return n + ((m.hoteles || []).length); }, 0);
    aviso.classList.toggle('oculto', total > 0 || esSuperadminSesion_());
  }

  function agruparPorModulo_(lista) {
    let grupoActual = null;
    return lista.map(function (h) {
      let encabezado = '';
      const grupo = h.modulo || '';
      if (grupo !== grupoActual) {
        grupoActual = grupo;
        if (grupo) encabezado = '<p class="propiedades-grupo" data-grupo="' + escaparHtml(grupo) + '">' + escaparHtml(grupo) + '</p>';
      }
      return encabezado + '<label class="propiedad-item" data-grupo="' + escaparHtml(grupo) + '"><input type="checkbox" value="' + escaparHtml(h.idHotel) + '"><span>' + escaparHtml(h.nombre) + '</span></label>';
    }).join('');
  }

  /** Filtra una lista de propiedades mientras se escribe (sin importar mayúsculas ni tildes); oculta los grupos sin resultados. */
  function filtrarListaPropiedades_(entrada, caja) {
    const termino = normalizarBusqueda_(entrada.value);
    let visibles = 0;
    caja.querySelectorAll('.propiedad-item').forEach(function (item) {
      const coincide = !termino || normalizarBusqueda_(item.textContent).indexOf(termino) !== -1;
      item.hidden = !coincide;
      if (coincide) visibles++;
    });
    caja.querySelectorAll('.propiedades-grupo').forEach(function (titulo) {
      titulo.hidden = !Array.prototype.some.call(caja.querySelectorAll('.propiedad-item'), function (item) {
        return item.dataset.grupo === titulo.dataset.grupo && !item.hidden;
      });
    });
    let vacio = caja.querySelector('.propiedades-sin-resultados');
    if (!visibles) {
      if (!vacio) {
        vacio = document.createElement('p');
        vacio.className = 'propiedades-estado propiedades-sin-resultados';
        vacio.textContent = 'Ninguna propiedad coincide con la búsqueda.';
        caja.appendChild(vacio);
      }
    } else if (vacio) {
      vacio.remove();
    }
  }

  function abrirPanelSolicitarAcceso() {
    abrirPanelLateral({
      titulo: 'Solicitar acceso',
      html: '<div id="panelAccesoRaiz" class="nueva-carpeta-form"><p class="propiedades-estado">Cargando tus accesos…</p></div>'
    });

    google.script.run
      .withSuccessHandler(function (datos) { renderizarPanelAcceso_(datos); })
      .withFailureHandler(function (error) {
        console.error('Error obtenerMisAccesos:', error);
        const raiz = document.getElementById('panelAccesoRaiz');
        if (raiz) raiz.innerHTML = '<p class="propiedades-estado">No se pudo cargar. Cierra este panel e inténtalo de nuevo.</p>';
      })
      .obtenerMisAccesos(getCurrentUserToken());
  }

  function renderizarPanelAcceso_(datos) {
    const raiz = document.getElementById('panelAccesoRaiz'); // si ya se cerró el panel, no se pinta nada
    if (!raiz) return;

    if (!datos || !datos.success) {
      raiz.innerHTML = '<p class="propiedades-estado">' + escaparHtml((datos && datos.message) || 'No se pudo cargar tu información.') + '</p>';
      return;
    }
    if (datos.tieneTodos) {
      raiz.innerHTML = '<p class="verificacion-texto">Ya tienes acceso a <strong>todas las propiedades</strong>, así que no necesitas pedir nada más.</p>';
      return;
    }

    const pendientes = datos.pendientes || [];
    const disponibles = datos.disponibles || [];

    let html = '<p class="verificacion-texto">Elige las propiedades a las que necesitas acceso. El administrador de cada una revisará tu solicitud.</p>';

    if (pendientes.length) {
      html += '<div class="acceso-pendientes"><p class="acceso-subtitulo">Solicitudes pendientes</p>' + pendientes.map(function (h) {
        return '<div class="acceso-pendiente"><span class="solicitud-item">' + ICONO_PROPIEDAD_ACCESO_ + '<span class="solicitud-nombre">' + escaparHtml(h.nombre) + '</span></span>' +
          '<button type="button" class="btn-cancelar-solicitud" data-id-hotel="' + escaparHtml(h.idHotel) + '">Cancelar</button></div>';
      }).join('') + '</div>';
    }

    if (disponibles.length) {
      html += '<p class="acceso-subtitulo">Pedir acceso a</p>' +
        '<input type="search" id="accesoBuscar" class="propiedades-buscador" placeholder="Buscar propiedad…" autocomplete="off" aria-label="Buscar propiedad">' +
        '<div class="propiedades-lista panel-solicitud-lista" id="accesoLista" role="group">' + agruparPorModulo_(disponibles) + '</div>' +
        '<p class="form-hint"><strong id="accesoContador"></strong></p>';
    } else {
      html += '<p class="propiedades-estado">Ya tienes acceso, o ya pediste, todas las propiedades disponibles.</p>';
    }

    html += '<div class="nueva-carpeta-acciones">' +
      '<button type="button" class="btn-cancelar" id="btnAccesoCerrar">Cerrar</button>' +
      (disponibles.length ? '<button type="button" class="btn-enviar" id="btnAccesoEnviar">Solicitar acceso</button>' : '') +
      '</div>';
    raiz.innerHTML = html;

    document.getElementById('btnAccesoCerrar').addEventListener('click', function () { cerrarPanelLateral(); });

    raiz.querySelectorAll('.btn-cancelar-solicitud').forEach(function (btn) {
      btn.addEventListener('click', function () { cancelarSolicitudAccesoUI_(btn.dataset.idHotel); });
    });

    if (disponibles.length) {
      const buscador = document.getElementById('accesoBuscar');
      const lista = document.getElementById('accesoLista');
      const contador = document.getElementById('accesoContador');
      buscador.addEventListener('input', function () { filtrarListaPropiedades_(buscador, lista); });
      lista.addEventListener('change', function () {
        const n = lista.querySelectorAll('input:checked').length;
        contador.textContent = n ? n + (n === 1 ? ' seleccionada' : ' seleccionadas') : '';
      });
      document.getElementById('btnAccesoEnviar').addEventListener('click', function () {
        const elegidas = Array.prototype.map.call(lista.querySelectorAll('input:checked'), function (c) { return c.value; });
        if (!elegidas.length) { showNotification('Elige al menos una propiedad', 'error', 2500); return; }
        enviarSolicitudAccesoUI_(elegidas);
      });
    }
  }

  function enviarSolicitudAccesoUI_(ids) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          showNotification('✅ ' + (result.message || 'Solicitud enviada'), 'success', 5000);
          cerrarPanelLateral();
          actualizarResumenAccesosPerfil_();
        } else {
          showNotification('Error: ' + ((result && result.message) || 'No se pudo enviar'), 'error', 4000);
        }
      })
      .withFailureHandler(function (error) { console.error('Error solicitarAccesoPropiedades:', error); showNotification('Error al enviar la solicitud', 'error', 3000); })
      .solicitarAccesoPropiedades(getCurrentUserToken(), ids);
  }

  function cancelarSolicitudAccesoUI_(idHotel) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          showNotification('Solicitud cancelada', 'info', 2500);
          abrirPanelSolicitarAcceso();       // se vuelve a pintar con la lista al día
          actualizarResumenAccesosPerfil_();
        } else {
          showNotification('Error: ' + ((result && result.message) || 'No se pudo cancelar'), 'error', 3500);
        }
      })
      .withFailureHandler(function (error) { console.error('Error cancelarSolicitudesPropias:', error); showNotification('Error al cancelar la solicitud', 'error', 3000); })
      .cancelarSolicitudesPropias(getCurrentUserToken(), [idHotel]);
  }

  /** Bloque "Mis accesos" del Perfil: a qué tiene acceso y qué pidió y sigue pendiente. */
  function actualizarResumenAccesosPerfil_() {
    // OJO: la plantilla oculta del Perfil tiene los mismos ids; se apunta a la copia VIVA (dentro de .home-content)
    const caja = document.querySelector('.home-content #perfilMisAccesos');
    if (!caja) return; // el Perfil aún no se ha abierto

    google.script.run
      .withSuccessHandler(function (datos) {
        const destino = document.querySelector('.home-content #perfilMisAccesos');
        if (!destino) return;
        const boton = document.querySelector('.home-content #btnSolicitarAccesoPerfil');
        if (!datos || !datos.success) { destino.innerHTML = '<p class="perfil-campo-valor">No se pudo cargar tu información de accesos.</p>'; return; }

        if (datos.tieneTodos) {
          destino.innerHTML = '<p class="perfil-campo-valor">Tienes acceso a <strong>todas las propiedades</strong>.</p>';
          if (boton) boton.classList.add('oculto');
          return;
        }
        if (boton) boton.classList.remove('oculto');

        const pildoras = function (lista, clase, maximo) {
          const visibles = lista.slice(0, maximo).map(function (h) {
            return '<span class="' + clase + '">' + ICONO_PROPIEDAD_ACCESO_ + '<span class="solicitud-nombre">' + escaparHtml(h.nombre) + '</span></span>';
          }).join('');
          return visibles + (lista.length > maximo ? '<span class="acceso-mas">+' + (lista.length - maximo) + ' más</span>' : '');
        };

        let html = '';
        html += '<div><p class="acceso-subtitulo">Tienes acceso a</p>' +
          (datos.permitidos.length ? '<div class="acceso-lista">' + pildoras(datos.permitidos, 'acceso-item', 12) + '</div>' : '<p class="perfil-campo-valor">Todavía no tienes ninguna propiedad.</p>') + '</div>';
        if (datos.pendientes.length) {
          html += '<div><p class="acceso-subtitulo">Solicitudes pendientes</p><div class="acceso-lista">' + pildoras(datos.pendientes, 'solicitud-item', 12) + '</div></div>';
        }
        destino.innerHTML = html;
      })
      .withFailureHandler(function (error) { console.error('Error obtenerMisAccesos (perfil):', error); })
      .obtenerMisAccesos(getCurrentUserToken());
  }

  // Una sola delegación atiende todas las entradas (menú del usuario, Perfil y aviso del Inicio)
  document.addEventListener('click', function (e) {
    const origen = e.target.closest ? e.target.closest('#btnSolicitarAccesoNavbar, #btnSolicitarAccesoPerfil, #btnSolicitarAccesoAviso') : null;
    if (origen) abrirPanelSolicitarAcceso();
  });
</script>
