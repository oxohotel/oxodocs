<script>
  // ==================== PANEL LATERAL (offcanvas derecho) ====================
  // Componente genérico y reutilizable: un único overlay+aside que se crea una sola vez bajo
  // demanda (igual que showConfirmation). Dos formas de usarlo:
  //   - abrirPanelLateral({titulo, html, onClose}) -> contenido simple, se pisa cada vez.
  //   - abrirPanelLateralConNodo({titulo, nodo, onClose}) -> MUEVE un nodo existente del DOM
  //     adentro del panel (para reusar formularios que ya tienen listeners atados a sus ids,
  //     como el de subir archivo) y lo regresa a su lugar original al cerrar.

  var _panelLateralNodoMovido = null;
  var _panelLateralNodoPadreOriginal = null;
  var _panelLateralNodoSiguienteOriginal = null;
  var _panelLateralOnClose = null;
  // Mensaje de un panel "protegido": cerrarlo (X, clic fuera, Escape) pide confirmación antes de descartarlo.
  var _panelLateralProtegido = null;

  function _obtenerPanelLateral() {
    let overlay = document.getElementById('panelLateralOverlay');
    if (overlay) return overlay;

    overlay = document.createElement('div');
    overlay.id = 'panelLateralOverlay';
    overlay.className = 'panel-lateral-overlay';
    overlay.innerHTML =
      '<aside class="panel-lateral" id="panelLateral">' +
        '<div class="panel-lateral-header">' +
          '<h3 id="panelLateralTitulo"></h3>' +
          '<button type="button" class="panel-lateral-cerrar" id="btnCerrarPanelLateral" aria-label="Cerrar">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
          '</button>' +
        '</div>' +
        '<div class="panel-lateral-body" id="panelLateralBody"></div>' +
      '</aside>';
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) cerrarPanelLateral();
    });
    document.getElementById('btnCerrarPanelLateral').addEventListener('click', cerrarPanelLateral);
    window.addEventListener('beforeunload', function (e) {
      if (_panelLateralProtegido && overlay.classList.contains('active')) { e.preventDefault(); e.returnValue = ''; }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('active')) cerrarPanelLateral();
    });

    return overlay;
  }

  function abrirPanelLateral(opciones) {
    opciones = opciones || {};
    const overlay = _obtenerPanelLateral();
    document.getElementById('panelLateralTitulo').textContent = opciones.titulo || '';
    document.getElementById('panelLateralBody').innerHTML = opciones.html || '';
    document.getElementById('panelLateral').classList.toggle('panel-lateral-grande', opciones.ancho === 'grande');
    _panelLateralOnClose = typeof opciones.onClose === 'function' ? opciones.onClose : null;
    _panelLateralProtegido = opciones.protegido || null;
    overlay.classList.add('active');
    if (typeof opciones.onAbrir === 'function') {
      try { opciones.onAbrir(document.getElementById('panelLateral')); } catch (e) { console.error('Error en onAbrir panel lateral:', e); }
    }
  }

  /** Mueve "nodo" (un elemento ya existente en el DOM) adentro del panel, conservando su
   *  posición original para poder devolverlo ahí mismo al cerrar. */
  function abrirPanelLateralConNodo(opciones) {
    opciones = opciones || {};
    const overlay = _obtenerPanelLateral();
    const body = document.getElementById('panelLateralBody');
    document.getElementById('panelLateralTitulo').textContent = opciones.titulo || '';

    const nodo = opciones.nodo;
    if (nodo && nodo.parentNode) {
      _panelLateralNodoMovido = nodo;
      _panelLateralNodoPadreOriginal = nodo.parentNode;
      _panelLateralNodoSiguienteOriginal = nodo.nextSibling;
      body.innerHTML = '';
      body.appendChild(nodo);
      nodo.style.display = '';
    }

    _panelLateralOnClose = typeof opciones.onClose === 'function' ? opciones.onClose : null;
    _panelLateralProtegido = opciones.protegido || null;
    overlay.classList.add('active');
  }

  var _panelLateralBloqueado = false;

  function _avisarSalidaDuranteBloqueo(e) {
    e.preventDefault();
    e.returnValue = '';
  }

  /** true si hay algo que no se debe interrumpir: una operación bloqueada a mano (subida de archivos)
   *  o cualquier escritura al servidor en curso (ver el puente google.script.run en build.js). */
  function hayOperacionEnCurso() {
    return _panelLateralBloqueado || (typeof window.oxoEscrituraEnCurso === 'function' && window.oxoEscrituraEnCurso());
  }

  /** Impide cerrar el panel (X, clic fuera, Escape) y recargar la pestaña sin aviso mientras
   *  haya una operación en curso, como una subida de archivos. */
  function bloquearPanelLateral() {
    _panelLateralBloqueado = true;
    const overlay = document.getElementById('panelLateralOverlay');
    if (overlay) overlay.classList.add('bloqueado');
    window.addEventListener('beforeunload', _avisarSalidaDuranteBloqueo);
  }

  function desbloquearPanelLateral() {
    _panelLateralBloqueado = false;
    const overlay = document.getElementById('panelLateralOverlay');
    if (overlay) overlay.classList.remove('bloqueado');
    window.removeEventListener('beforeunload', _avisarSalidaDuranteBloqueo);
  }

  /** "forzar" debe ser exactamente true (los listeners de clic reciben el evento como 1er argumento). */
  function cerrarPanelLateral(forzar) {
    if (hayOperacionEnCurso()) {
      if (typeof showNotification === 'function') {
        showNotification('Espera a que termine la operación en curso antes de cerrar.', 'info', 2200);
      }
      return;
    }

    if (_panelLateralProtegido && forzar !== true) {
      if (typeof showConfirmation === 'function') {
        showConfirmation(_panelLateralProtegido, '¿Cerrar sin terminar?', function () { cerrarPanelLateral(true); });
      }
      return;
    }
    _panelLateralProtegido = null;

    const overlay = document.getElementById('panelLateralOverlay');
    if (overlay) overlay.classList.remove('active');

    if (_panelLateralNodoMovido && _panelLateralNodoPadreOriginal) {
      _panelLateralNodoMovido.style.display = 'none';
      _panelLateralNodoPadreOriginal.insertBefore(_panelLateralNodoMovido, _panelLateralNodoSiguienteOriginal);
    }
    _panelLateralNodoMovido = null;
    _panelLateralNodoPadreOriginal = null;
    _panelLateralNodoSiguienteOriginal = null;

    if (_panelLateralOnClose) {
      const callback = _panelLateralOnClose;
      _panelLateralOnClose = null;
      callback();
    }
  }
</script>
