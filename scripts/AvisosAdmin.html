<script>
  // ==================== Avisos: crear, editar, cancelar (solo Superadministradores) ====================
  // Se abren desde los botones "Nuevo" y "Gestionar" de la campana. El servidor decide siempre si la persona puede (rol 3): aquí solo
  // se ocultan los botones a quien no corresponde.

  var NOMBRES_ROLES_AVISO_ = { 1: "Usuarios", 2: "Administradores", 3: "Superadministradores" };
  var estadoEditorAviso_ = null;

  function esSuperadminUI_() { return typeof sesionPuede === "function" && sesionPuede("Gestionar_Roles"); }

  function mostrarBotonesAdminAvisos_() {
    const caja = document.getElementById("avisosAdminBotones");
    if (caja) caja.style.display = esSuperadminUI_() ? "flex" : "none";
  }

  function llamarServidorAviso_(nombre) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[nombre].apply(null, args);
    });
  }

  function cerrarOverlayAviso_(id) {
    if (typeof escrituraEnCursoBloquea_ === "function" && escrituraEnCursoBloquea_()) return;
    const o = document.getElementById(id);
    if (o) o.remove();
  }

  function crearOverlayAviso_(id, ancho) {
    cerrarOverlayAviso_(id);
    const overlay = document.createElement("div");
    overlay.id = id;
    overlay.className = "aviso-overlay";
    overlay.innerHTML = '<div class="aviso-modal" role="dialog" aria-modal="true" style="max-width:' + (ancho || 640) + 'px"></div>';
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) cerrarOverlayAviso_(id); });
    document.body.appendChild(overlay);
    return overlay.querySelector(".aviso-modal");
  }

  // ---------------------------------------------------------------------------------------------------------------
  // Lista de gestión
  // ---------------------------------------------------------------------------------------------------------------

  function formatoFechaAviso_(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString("es-ES", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function abrirGestionDeAvisos_() {
    cerrarTodosLosDropdowns();
    const modal = crearOverlayAviso_("overlayAvisosGestion", 760);
    modal.innerHTML = encabezadoModalAviso_("Gestionar avisos", "overlayAvisosGestion") + '<div class="aviso-cuerpo" id="avGestionCuerpo"><p class="aviso-vacio">Cargando…</p></div>' +
      '<div class="aviso-pie"><button type="button" class="aviso-btn aviso-btn-primario" id="avGestionNuevo">+ Nuevo aviso</button></div>';
    modal.querySelector(".aviso-cerrar").addEventListener("click", function () { cerrarOverlayAviso_("overlayAvisosGestion"); });
    modal.querySelector("#avGestionNuevo").addEventListener("click", function () { abrirEditorDeAviso_(null); });
    cargarGestionDeAvisos_();
  }

  function encabezadoModalAviso_(titulo, idOverlay) {
    return '<div class="aviso-encabezado"><h3>' + escaparHtml(titulo) + '</h3><button type="button" class="aviso-cerrar" aria-label="Cerrar">✕</button></div>';
  }

  function cargarGestionDeAvisos_() {
    const token = getCurrentUserToken();
    llamarServidorAviso_("obtenerAvisosGestion", token).then(function (r) {
      const cuerpo = document.getElementById("avGestionCuerpo");
      if (!cuerpo) return;
      if (!r || !r.success) { cuerpo.innerHTML = '<p class="aviso-vacio">' + escaparHtml((r && r.message) || "No se pudo cargar la lista") + "</p>"; return; }
      window.__avisosGestion = r.avisos;
      if (!r.avisos.length) { cuerpo.innerHTML = '<p class="aviso-vacio">Todavía no hay avisos. Crea el primero con «Nuevo aviso».</p>'; return; }
      cuerpo.innerHTML = r.avisos.map(function (a, i) {
        const clase = { Programado: "estado-programado", Enviado: "estado-enviado", Caducado: "estado-caducado", Cancelado: "estado-cancelado" }[a.estado] || "";
        const cuando = a.estado === "Programado" ? "Se enviará el " + formatoFechaAviso_(a.programadoPara) : "Enviado el " + formatoFechaAviso_(a.programadoPara);
        const alcance = a.estado === "Programado" ? "Llegará a " + a.destinatarios + " persona(s)" : "Llegó a " + a.destinatarios + " persona(s) · " + a.vistos + " ya lo vieron";
        return '<div class="aviso-gestion-item">' +
          '<div class="aviso-gestion-cab"><strong>' + escaparHtml(a.titulo) + '</strong><span class="aviso-estado ' + clase + '">' + escaparHtml(a.estado) + "</span></div>" +
          '<div class="aviso-gestion-meta">' + escaparHtml(a.audienciaTexto) + "</div>" +
          '<div class="aviso-gestion-meta">' + escaparHtml(cuando) + (a.caducaEn ? " · caduca el " + escaparHtml(formatoFechaAviso_(a.caducaEn)) : "") + " · " + escaparHtml(alcance) + "</div>" +
          '<div class="aviso-gestion-acciones">' +
            (a.editable ? '<button type="button" class="aviso-btn" data-accion="editar" data-i="' + i + '">Editar</button>' : "") +
            (a.estado !== "Cancelado" ? '<button type="button" class="aviso-btn aviso-btn-peligro" data-accion="cancelar" data-i="' + i + '">Cancelar aviso</button>' : "") +
          "</div></div>";
      }).join("");
      cuerpo.querySelectorAll("button[data-accion]").forEach(function (b) {
        b.addEventListener("click", function () {
          const a = window.__avisosGestion[Number(b.dataset.i)];
          if (b.dataset.accion === "editar") abrirEditorDeAviso_(a);
          else confirmarCancelarAviso_(a);
        });
      });
    }).catch(function () {
      const cuerpo = document.getElementById("avGestionCuerpo");
      if (cuerpo) cuerpo.innerHTML = '<p class="aviso-vacio">Error de conexión. Inténtalo de nuevo.</p>';
    });
  }

  function confirmarCancelarAviso_(a) {
    showConfirmation('¿Cancelar el aviso «' + a.titulo + '»? Dejará de verse para todas las personas.', "Cancelar aviso", function () {
      llamarServidorAviso_("cancelarAviso", a.id, getCurrentUserToken()).then(function (r) {
        if (r && r.success) { showNotification("Aviso cancelado", "success", 2200); cargarGestionDeAvisos_(); if (typeof cargarAvisos_ === "function") cargarAvisos_(); }
        else showNotification((r && r.message) || "No se pudo cancelar", "error", 3500);
      }).catch(function () { showNotification("Error de conexión", "error", 3000); });
    });
  }

  // ---------------------------------------------------------------------------------------------------------------
  // Editor (crear / editar)
  // ---------------------------------------------------------------------------------------------------------------

  /** Valor para un <input type="datetime-local"> (hora local) a partir de una fecha ISO. */
  function valorDatetimeLocal_(iso) {
    if (!iso) return "";
    const d = new Date(iso), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function abrirEditorDeAviso_(existente) {
    const modal = crearOverlayAviso_("overlayAvisoEditor", 680);
    modal.innerHTML = encabezadoModalAviso_(existente ? "Editar aviso" : "Nuevo aviso") + '<div class="aviso-cuerpo"><p class="aviso-vacio">Cargando propiedades y personas…</p></div>';
    modal.querySelector(".aviso-cerrar").addEventListener("click", function () { cerrarOverlayAviso_("overlayAvisoEditor"); });

    Promise.all([llamarServidorAviso_("obtenerHotelesParaRegistro"), llamarServidorAviso_("obtenerListaUsuariosParaPermisos")]).then(function (res) {
      const hoteles = (res[0] && res[0].hoteles) || [];
      const usuarios = (res[1] && res[1].usuarios) || [];
      estadoEditorAviso_ = {
        id: existente ? existente.id : null,
        hoteles: hoteles, usuarios: usuarios, areas: {},
        enlaces: [], audTipo: "todos", roles: [], propiedades: [], personas: [],
        envio: "ahora", fecha: "", conCaducidad: false, fechaCaduca: "", guardando: false
      };
      if (existente) {
        estadoEditorAviso_.audTipo = existente.audiencia.tipo;
        estadoEditorAviso_.roles = (existente.audiencia.roles || []).map(Number);
        estadoEditorAviso_.propiedades = (existente.audiencia.propiedades || []).map(String);
        estadoEditorAviso_.personas = (existente.audiencia.personas || []).map(String);
        estadoEditorAviso_.enlaces = (existente.enlaces || []).map(function (e) {
          return { texto: e.texto, tipo: e.tipo === "archivo" ? "carpeta" : e.tipo, url: e.url || "", idHotel: e.idHotel || "", idCarpeta: e.tipo === "carpeta" ? e.id : (e.idCarpeta || ""), nombreCarpeta: e.nombre || "" };
        });
        estadoEditorAviso_.envio = "programar";
        estadoEditorAviso_.fecha = valorDatetimeLocal_(existente.programadoPara);
        estadoEditorAviso_.conCaducidad = !!existente.caducaEn;
        estadoEditorAviso_.fechaCaduca = valorDatetimeLocal_(existente.caducaEn);
      }
      construirEditorAviso_(modal, existente);
    }).catch(function () {
      modal.querySelector(".aviso-cuerpo").innerHTML = '<p class="aviso-vacio">No se pudieron cargar las propiedades y personas. Inténtalo de nuevo.</p>';
    });
  }

  function construirEditorAviso_(modal, existente) {
    const e = estadoEditorAviso_;
    modal.innerHTML = encabezadoModalAviso_(existente ? "Editar aviso" : "Nuevo aviso") +
      '<div class="aviso-cuerpo">' +
        '<label class="aviso-etiqueta" for="avTitulo">Título</label>' +
        '<input type="text" id="avTitulo" class="aviso-campo" maxlength="120" placeholder="Ej. Mantenimiento programado" value="' + escaparHtml(existente ? existente.titulo : "") + '">' +
        '<label class="aviso-etiqueta" for="avMensaje">Mensaje <span class="aviso-contador" id="avContador">0 / 2000</span></label>' +
        '<textarea id="avMensaje" class="aviso-campo" rows="5" maxlength="2000" placeholder="Escribe el comunicado…">' + escaparHtml(existente ? existente.mensaje : "") + "</textarea>" +

        '<div class="aviso-seccion"><div class="aviso-etiqueta">Enlaces <span class="aviso-ayuda">(opcional, hasta 5)</span></div>' +
        '<div id="avEnlaces"></div><button type="button" class="aviso-btn" id="avAgregarEnlace">+ Añadir enlace</button></div>' +

        '<div class="aviso-seccion"><div class="aviso-etiqueta">¿A quién le llega?</div>' +
          opcionAudiencia_("todos", "Todas las personas", "Cualquier persona con acceso al sistema.") +
          opcionAudiencia_("roles", "Por rol", "Elige uno o varios roles.") +
          opcionAudiencia_("propiedades", "Por propiedad", "Quienes tienen acceso a las propiedades que elijas.") +
          opcionAudiencia_("personas", "Personas concretas", "Busca y elige a quién enviarlo.") +
        '<div id="avAudDetalle"></div></div>' +

        '<div class="aviso-seccion"><div class="aviso-etiqueta">¿Cuándo?</div>' +
          '<label class="aviso-radio"><input type="radio" name="avEnvio" value="ahora"' + (e.envio === "ahora" ? " checked" : "") + '> Enviar ahora</label>' +
          '<label class="aviso-radio"><input type="radio" name="avEnvio" value="programar"' + (e.envio === "programar" ? " checked" : "") + '> Programar</label>' +
          '<input type="datetime-local" id="avFecha" class="aviso-campo" value="' + escaparHtml(e.fecha) + '"' + (e.envio === "programar" ? "" : " disabled") + '>' +
          '<label class="aviso-radio"><input type="checkbox" id="avConCaducidad"' + (e.conCaducidad ? " checked" : "") + '> Que deje de verse en una fecha</label>' +
          '<input type="datetime-local" id="avFechaCaduca" class="aviso-campo" value="' + escaparHtml(e.fechaCaduca) + '"' + (e.conCaducidad ? "" : " disabled") + "></div>" +

        '<div class="aviso-seccion"><div class="aviso-etiqueta">Vista previa</div><div class="navbar-dropdown-vista" id="avVista"></div></div>' +
        '<p class="aviso-error" id="avError" role="alert"></p>' +
      "</div>" +
      '<div class="aviso-pie"><button type="button" class="aviso-btn" id="avCancelar">Cancelar</button>' +
      '<button type="button" class="aviso-btn aviso-btn-primario" id="avGuardar"></button></div>';

    modal.querySelector(".aviso-cerrar").addEventListener("click", function () { cerrarOverlayAviso_("overlayAvisoEditor"); });
    modal.querySelector("#avCancelar").addEventListener("click", function () { cerrarOverlayAviso_("overlayAvisoEditor"); });

    const refrescar = function () { actualizarContadorAviso_(); renderizarVistaPreviaAviso_(); actualizarBotonGuardarAviso_(); };
    modal.querySelector("#avTitulo").addEventListener("input", refrescar);
    modal.querySelector("#avMensaje").addEventListener("input", refrescar);
    modal.querySelector("#avAgregarEnlace").addEventListener("click", function () {
      if (e.enlaces.length >= 5) { mostrarErrorAviso_("Máximo 5 enlaces por aviso"); return; }
      e.enlaces.push({ texto: "", tipo: "url", url: "", idHotel: "", idCarpeta: "", nombreCarpeta: "" });
      renderizarEnlacesAviso_();
    });
    modal.querySelectorAll('input[name="avAud"]').forEach(function (r) {
      if (r.value === e.audTipo) r.checked = true;
      r.addEventListener("change", function () { e.audTipo = r.value; renderizarDetalleAudiencia_(); renderizarVistaPreviaAviso_(); });
    });
    modal.querySelectorAll('input[name="avEnvio"]').forEach(function (r) {
      r.addEventListener("change", function () {
        e.envio = r.value;
        modal.querySelector("#avFecha").disabled = e.envio !== "programar";
        actualizarBotonGuardarAviso_();
      });
    });
    modal.querySelector("#avFecha").addEventListener("input", function (ev) { e.fecha = ev.target.value; });
    modal.querySelector("#avConCaducidad").addEventListener("change", function (ev) { e.conCaducidad = ev.target.checked; modal.querySelector("#avFechaCaduca").disabled = !e.conCaducidad; });
    modal.querySelector("#avFechaCaduca").addEventListener("input", function (ev) { e.fechaCaduca = ev.target.value; });
    modal.querySelector("#avGuardar").addEventListener("click", guardarAvisoDesdeEditor_);

    renderizarEnlacesAviso_();
    renderizarDetalleAudiencia_();
    refrescar();
    setTimeout(function () { const t = modal.querySelector("#avTitulo"); if (t) t.focus(); }, 50);
  }

  function opcionAudiencia_(valor, titulo, detalle) {
    return '<label class="aviso-opcion"><input type="radio" name="avAud" value="' + valor + '"><span><strong>' + escaparHtml(titulo) + "</strong><small>" + escaparHtml(detalle) + "</small></span></label>";
  }

  function mostrarErrorAviso_(texto) { const el = document.getElementById("avError"); if (el) el.textContent = texto || ""; }

  function actualizarContadorAviso_() {
    const m = document.getElementById("avMensaje"), c = document.getElementById("avContador");
    if (m && c) c.textContent = m.value.length + " / 2000";
  }

  function actualizarBotonGuardarAviso_() {
    const b = document.getElementById("avGuardar");
    if (!b) return;
    const e = estadoEditorAviso_;
    b.textContent = e.id ? "Guardar cambios" : (e.envio === "programar" ? "Programar aviso" : "Enviar aviso");
  }

  // ---- Enlaces
  function renderizarEnlacesAviso_() {
    const e = estadoEditorAviso_, cont = document.getElementById("avEnlaces");
    if (!cont) return;
    cont.innerHTML = e.enlaces.map(function (en, i) {
      const opcionesHotel = '<option value="">Elige una propiedad…</option>' + e.hoteles.map(function (h) { return '<option value="' + escaparHtml(h.idHotel) + '"' + (String(h.idHotel) === String(en.idHotel) ? " selected" : "") + ">" + escaparHtml(h.nombre) + "</option>"; }).join("");
      let destino = "";
      if (en.tipo === "url") destino = '<input type="url" class="aviso-campo" data-campo="url" placeholder="https://…" value="' + escaparHtml(en.url) + '">';
      else if (en.tipo === "hotel") destino = '<select class="aviso-campo" data-campo="idHotel">' + opcionesHotel + "</select>";
      else {
        const areas = e.areas[en.idHotel] || [];
        let opcionesArea = '<option value="">' + (en.idHotel ? (e.areas[en.idHotel] ? "Elige una carpeta…" : "Cargando…") : "Primero elige la propiedad") + "</option>" +
          areas.map(function (a) { return '<option value="' + escaparHtml(a.id) + '"' + (String(a.id) === String(en.idCarpeta) ? " selected" : "") + ">" + escaparHtml(a.nombre) + "</option>"; }).join("");
        if (en.idCarpeta && !areas.some(function (a) { return String(a.id) === String(en.idCarpeta); }) && en.nombreCarpeta) opcionesArea += '<option value="' + escaparHtml(en.idCarpeta) + '" selected>' + escaparHtml(en.nombreCarpeta) + "</option>";
        destino = '<select class="aviso-campo" data-campo="idHotelCarpeta">' + opcionesHotel + '</select><select class="aviso-campo" data-campo="idCarpeta">' + opcionesArea + "</select>";
      }
      return '<div class="aviso-enlace-fila" data-i="' + i + '">' +
        '<input type="text" class="aviso-campo" data-campo="texto" maxlength="60" placeholder="Texto del botón" value="' + escaparHtml(en.texto) + '">' +
        '<select class="aviso-campo" data-campo="tipo"><option value="url"' + (en.tipo === "url" ? " selected" : "") + '>Enlace externo (https)</option><option value="hotel"' + (en.tipo === "hotel" ? " selected" : "") + '>Una propiedad</option><option value="carpeta"' + (en.tipo === "carpeta" ? " selected" : "") + ">Una carpeta</option></select>" +
        destino + '<button type="button" class="aviso-btn aviso-btn-peligro" data-quitar="' + i + '" aria-label="Quitar enlace">✕</button></div>';
    }).join("");

    cont.querySelectorAll(".aviso-enlace-fila").forEach(function (fila) {
      const i = Number(fila.dataset.i), en = e.enlaces[i];
      fila.querySelectorAll("[data-campo]").forEach(function (campo) {
        const evento = campo.tagName === "SELECT" ? "change" : "input";
        campo.addEventListener(evento, function () {
          const c = campo.dataset.campo;
          if (c === "texto") en.texto = campo.value;
          else if (c === "url") en.url = campo.value;
          else if (c === "tipo") { en.tipo = campo.value; en.idCarpeta = ""; renderizarEnlacesAviso_(); }
          else if (c === "idHotel") en.idHotel = campo.value;
          else if (c === "idHotelCarpeta") { en.idHotel = campo.value; en.idCarpeta = ""; cargarAreasParaEnlace_(en.idHotel); renderizarEnlacesAviso_(); }
          else if (c === "idCarpeta") en.idCarpeta = campo.value;
          renderizarVistaPreviaAviso_();
        });
      });
      const quitar = fila.querySelector("[data-quitar]");
      if (quitar) quitar.addEventListener("click", function () { e.enlaces.splice(i, 1); renderizarEnlacesAviso_(); renderizarVistaPreviaAviso_(); });
      if (en.tipo === "carpeta" && en.idHotel && !e.areas[en.idHotel]) cargarAreasParaEnlace_(en.idHotel);
    });
    renderizarVistaPreviaAviso_();
  }

  function cargarAreasParaEnlace_(idHotel) {
    const e = estadoEditorAviso_;
    if (!idHotel || e.areas[idHotel] || e.areas["_cargando_" + idHotel]) return;
    e.areas["_cargando_" + idHotel] = true;
    const sesion = getCurrentUserSession();
    llamarServidorAviso_("obtenerCarpetasDelHotel", idHotel, getCurrentUserToken(), sesion && (sesion.ID_Usuario || sesion.idUsuario)).then(function (r) {
      e.areas[idHotel] = (r && r.success && r.carpetas) ? r.carpetas.map(function (c) { return { id: c.id, nombre: c.nombre }; }) : [];
      if (document.getElementById("avEnlaces")) renderizarEnlacesAviso_();
    }).catch(function () { e.areas[idHotel] = []; });
  }

  // ---- Audiencia
  function renderizarDetalleAudiencia_() {
    const e = estadoEditorAviso_, cont = document.getElementById("avAudDetalle");
    if (!cont) return;
    if (e.audTipo === "todos") { cont.innerHTML = ""; return; }

    if (e.audTipo === "roles") {
      cont.innerHTML = '<div class="aviso-lista">' + [1, 2, 3].map(function (r) {
        return '<label class="aviso-check"><input type="checkbox" data-rol="' + r + '"' + (e.roles.indexOf(r) !== -1 ? " checked" : "") + "> " + NOMBRES_ROLES_AVISO_[r] + " (rol " + r + ")</label>";
      }).join("") + "</div>";
      cont.querySelectorAll("[data-rol]").forEach(function (c) {
        c.addEventListener("change", function () {
          const r = Number(c.dataset.rol);
          e.roles = c.checked ? e.roles.concat([r]) : e.roles.filter(function (x) { return x !== r; });
          renderizarVistaPreviaAviso_();
        });
      });
      return;
    }

    const esProp = e.audTipo === "propiedades";
    cont.innerHTML = '<input type="search" class="aviso-campo" id="avBuscar" placeholder="' + (esProp ? "Buscar propiedad…" : "Buscar por nombre o correo…") + '">' +
      '<div class="aviso-seleccion" id="avSeleccion"></div><div class="aviso-lista" id="avLista"></div>';
    cont.querySelector("#avBuscar").addEventListener("input", pintarListaAudiencia_);
    pintarListaAudiencia_();
  }

  function pintarListaAudiencia_() {
    const e = estadoEditorAviso_, esProp = e.audTipo === "propiedades";
    const buscar = ((document.getElementById("avBuscar") || {}).value || "").trim().toLowerCase();
    const elegidos = esProp ? e.propiedades : e.personas;
    const fuente = esProp
      ? e.hoteles.map(function (h) { return { id: String(h.idHotel), nombre: h.nombre, detalle: h.modulo }; })
      : e.usuarios.map(function (u) { return { id: String(u.id), nombre: u.nombre, detalle: u.email }; });

    const sel = document.getElementById("avSeleccion");
    sel.innerHTML = elegidos.length ? elegidos.map(function (id) {
      const x = fuente.filter(function (f) { return f.id === id; })[0];
      return '<span class="aviso-chip">' + escaparHtml(x ? x.nombre : id) + '<button type="button" data-quitar="' + escaparHtml(id) + '" aria-label="Quitar">✕</button></span>';
    }).join("") : '<span class="aviso-ayuda">Aún no has elegido ' + (esProp ? "ninguna propiedad" : "a nadie") + ".</span>";
    sel.querySelectorAll("[data-quitar]").forEach(function (b) {
      b.addEventListener("click", function () { quitarDeAudiencia_(b.dataset.quitar); });
    });

    const lista = document.getElementById("avLista");
    const visibles = fuente.filter(function (f) { return !buscar || f.nombre.toLowerCase().indexOf(buscar) !== -1 || String(f.detalle || "").toLowerCase().indexOf(buscar) !== -1; }).slice(0, esProp ? 60 : 40);
    lista.innerHTML = visibles.length ? visibles.map(function (f) {
      return '<label class="aviso-check"><input type="checkbox" data-id="' + escaparHtml(f.id) + '"' + (elegidos.indexOf(f.id) !== -1 ? " checked" : "") + "> <span>" + escaparHtml(f.nombre) + "<small>" + escaparHtml(f.detalle || "") + "</small></span></label>";
    }).join("") : '<p class="aviso-ayuda">Sin resultados.</p>';
    lista.querySelectorAll("[data-id]").forEach(function (c) {
      c.addEventListener("change", function () {
        const arr = esProp ? e.propiedades : e.personas;
        const nuevo = c.checked ? arr.concat([c.dataset.id]) : arr.filter(function (x) { return x !== c.dataset.id; });
        if (esProp) e.propiedades = nuevo; else e.personas = nuevo;
        pintarListaAudiencia_(); renderizarVistaPreviaAviso_();
      });
    });
  }

  function quitarDeAudiencia_(id) {
    const e = estadoEditorAviso_;
    if (e.audTipo === "propiedades") e.propiedades = e.propiedades.filter(function (x) { return x !== id; });
    else e.personas = e.personas.filter(function (x) { return x !== id; });
    pintarListaAudiencia_(); renderizarVistaPreviaAviso_();
  }

  // ---- Vista previa y guardado
  function enlacesParaServidor_() {
    return estadoEditorAviso_.enlaces.map(function (en) {
      const base = { texto: en.texto, tipo: en.tipo };
      if (en.tipo === "url") base.url = en.url;
      else if (en.tipo === "hotel") base.id = en.idHotel;
      else base.id = en.idCarpeta;
      return base;
    });
  }

  function descripcionAudienciaEditor_() {
    const e = estadoEditorAviso_;
    if (e.audTipo === "todos") return "Para: todas las personas";
    if (e.audTipo === "roles") return "Para: " + (e.roles.length ? e.roles.sort().map(function (r) { return NOMBRES_ROLES_AVISO_[r]; }).join(", ") : "ningún rol todavía");
    if (e.audTipo === "propiedades") return "Para: " + (e.propiedades.length ? e.propiedades.length + " propiedad(es)" : "ninguna propiedad todavía");
    return "Para: " + (e.personas.length ? e.personas.length + " persona(s)" : "nadie todavía");
  }

  function renderizarVistaPreviaAviso_() {
    const cont = document.getElementById("avVista");
    if (!cont || !estadoEditorAviso_) return;
    const titulo = (document.getElementById("avTitulo") || {}).value || "";
    const mensaje = (document.getElementById("avMensaje") || {}).value || "";
    const enlaces = estadoEditorAviso_.enlaces.filter(function (e) { return e.texto; });
    cont.innerHTML = '<div class="notif-item aviso aviso-nuevo"><div class="aviso-titulo"><span class="aviso-marca"></span>' + escaparHtml(titulo || "Título del aviso") + "</div>" +
      '<div class="aviso-mensaje">' + escaparHtml(mensaje || "Aquí se verá el mensaje.") + "</div>" +
      (enlaces.length ? '<div class="aviso-enlaces">' + enlaces.map(function (e) { return '<span class="aviso-enlace">' + iconoDeEnlaceAviso_(e.tipo) + "<span>" + escaparHtml(e.texto) + "</span></span>"; }).join("") + "</div>" : "") +
      '<span class="notif-time">' + escaparHtml(descripcionAudienciaEditor_()) + "</span></div>";
  }

  function guardarAvisoDesdeEditor_() {
    const e = estadoEditorAviso_;
    if (e.guardando) return;
    mostrarErrorAviso_("");
    const titulo = document.getElementById("avTitulo").value.trim();
    const mensaje = document.getElementById("avMensaje").value.trim();
    if (!titulo) { mostrarErrorAviso_("Escribe un título"); return; }
    if (!mensaje) { mostrarErrorAviso_("Escribe el mensaje"); return; }
    if (e.audTipo === "roles" && !e.roles.length) { mostrarErrorAviso_("Elige al menos un rol"); return; }
    if (e.audTipo === "propiedades" && !e.propiedades.length) { mostrarErrorAviso_("Elige al menos una propiedad"); return; }
    if (e.audTipo === "personas" && !e.personas.length) { mostrarErrorAviso_("Elige al menos una persona"); return; }
    if (e.envio === "programar" && !e.fecha) { mostrarErrorAviso_("Elige la fecha y hora del envío"); return; }
    if (e.conCaducidad && !e.fechaCaduca) { mostrarErrorAviso_("Elige la fecha en que deja de verse"); return; }
    for (let i = 0; i < e.enlaces.length; i++) {
      const en = e.enlaces[i];
      if (!en.texto.trim()) { mostrarErrorAviso_("Cada enlace necesita un texto"); return; }
      if (en.tipo === "url" && !/^https:\/\/[^\s<>"']+$/i.test(en.url.trim())) { mostrarErrorAviso_("El enlace «" + en.texto + "» debe empezar por https://"); return; }
      if (en.tipo === "hotel" && !en.idHotel) { mostrarErrorAviso_("Elige la propiedad del enlace «" + en.texto + "»"); return; }
      if (en.tipo === "carpeta" && !en.idCarpeta) { mostrarErrorAviso_("Elige la carpeta del enlace «" + en.texto + "»"); return; }
    }

    const audiencia = { tipo: e.audTipo };
    if (e.audTipo === "roles") audiencia.roles = e.roles;
    if (e.audTipo === "propiedades") audiencia.propiedades = e.propiedades;
    if (e.audTipo === "personas") audiencia.personas = e.personas;
    const datos = {
      titulo: titulo, mensaje: mensaje, enlaces: enlacesParaServidor_(), audiencia: audiencia,
      programadoPara: e.envio === "programar" ? new Date(e.fecha).toISOString() : null,
      caducaEn: e.conCaducidad ? new Date(e.fechaCaduca).toISOString() : null
    };

    e.guardando = true;
    const boton = document.getElementById("avGuardar");
    boton.disabled = true; boton.textContent = "Guardando…";
    const token = getCurrentUserToken();
    const llamada = e.id ? llamarServidorAviso_("editarAviso", e.id, datos, token) : llamarServidorAviso_("crearAviso", datos, token);
    llamada.then(function (r) {
      e.guardando = false;
      if (r && r.success) {
        cerrarOverlayAviso_("overlayAvisoEditor");
        showNotification(r.message || "Aviso guardado", "success", 2500);
        if (document.getElementById("overlayAvisosGestion")) cargarGestionDeAvisos_();
        if (typeof cargarAvisos_ === "function") cargarAvisos_();
      } else {
        boton.disabled = false; actualizarBotonGuardarAviso_();
        mostrarErrorAviso_((r && r.message) || "No se pudo guardar el aviso");
      }
    }).catch(function () {
      e.guardando = false; boton.disabled = false; actualizarBotonGuardarAviso_();
      mostrarErrorAviso_("Error de conexión. Inténtalo de nuevo.");
    });
  }
</script>
