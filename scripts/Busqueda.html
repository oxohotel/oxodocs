<script>
  var ICONO_RESULTADO_HOTEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>';
  var ICONO_RESULTADO_CARPETA = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 6a1 1 0 011-1h5l2 2h9a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V6z"/></svg>';

  var temporizadorBusquedaGlobal = null;

  // Índice local: todo lo que esta persona puede encontrar (propiedades y carpetas), pedido una vez y filtrado aquí al escribir.
  // Se guarda también como copia de vista para que esté listo desde el primer instante de la siguiente visita.
  var indiceBusqueda_ = { datos: null, cargadoEn: 0, cargando: false };
  var INDICE_BUSQUEDA_VIGENCIA_MS = 2 * 60 * 1000;

  function normalizarBusqueda_(texto) {
    return String(texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function prepararIndiceBusqueda_(crudo) {
    const nombresHotel = {};
    const hoteles = (crudo.hoteles || []).map(function (h) { nombresHotel[h[0]] = h[1]; return { idHotel: h[0], nombre: h[1], n: normalizarBusqueda_(h[1]) }; });
    const carpetas = (crudo.carpetas || []).map(function (c) { return { idCarpeta: c[0], idHotel: c[1], nombre: c[2], nombreHotel: nombresHotel[c[1]] || "", n: normalizarBusqueda_(c[2]) }; });
    return { hoteles: hoteles, carpetas: carpetas };
  }

  function cargarIndiceBusqueda_(forzar) {
    if (indiceBusqueda_.cargando) return;
    if (!forzar && indiceBusqueda_.datos && Date.now() - indiceBusqueda_.cargadoEn < INDICE_BUSQUEDA_VIGENCIA_MS) return;
    const sesion = typeof getCurrentUserSession === "function" ? getCurrentUserSession() : null;
    const idUsuario = sesion && (sesion.ID_Usuario || sesion.idUsuario);
    if (!idUsuario || !window.google || !google.script || !google.script.run) return;

    if (!indiceBusqueda_.datos && typeof leerCacheVista_ === "function") {
      const copia = leerCacheVista_("indiceBusqueda");
      if (copia && Array.isArray(copia.hoteles)) { indiceBusqueda_.datos = prepararIndiceBusqueda_(copia); indiceBusqueda_.cargadoEn = 1; }
    }
    indiceBusqueda_.cargando = true;
    google.script.run
      .withSuccessHandler(function (r) {
        indiceBusqueda_.cargando = false;
        if (!r || r.success !== true) return;
        indiceBusqueda_.datos = prepararIndiceBusqueda_(r);
        indiceBusqueda_.cargadoEn = Date.now();
        if (typeof guardarCacheVista_ === "function") guardarCacheVista_("indiceBusqueda", { hoteles: r.hoteles, carpetas: r.carpetas });
      })
      .withFailureHandler(function () { indiceBusqueda_.cargando = false; })
      .obtenerIndiceDeBusqueda(idUsuario);
  }

  /** Filtra el índice local. Primero lo que EMPIEZA por lo escrito, luego lo que tiene una palabra que empieza así, luego el resto. */
  function buscarEnIndiceLocal_(termino) {
    const t = normalizarBusqueda_(termino);
    const puntuar = function (n) {
      if (n.indexOf(t) === -1) return -1;
      if (n.indexOf(t) === 0) return 0;
      return (" " + n).indexOf(" " + t) !== -1 ? 1 : 2;
    };
    const filtrar = function (lista) {
      return lista.map(function (x, i) { return { x: x, p: puntuar(x.n), i: i }; })
        .filter(function (r) { return r.p !== -1; })
        .sort(function (a, b) { return (a.p - b.p) || (a.i - b.i); })
        .slice(0, 8).map(function (r) { return r.x; });
    };
    return { hoteles: filtrar(indiceBusqueda_.datos.hoteles), carpetas: filtrar(indiceBusqueda_.datos.carpetas) };
  }

  function inicializarBusquedaGlobal() {
    const input = document.getElementById("navbarSearchInput");
    const wrapper = document.getElementById("navbarSearchWrapper");
    const resultados = document.getElementById("navbarSearchResultados");
    if (!input || !wrapper || !resultados) return;

    // Limpiar cualquier autocompletado espurio del navegador al inicio
    input.value = '';
    resultados.classList.remove('abierto');
    setTimeout(function() {
      if (document.activeElement !== input) {
        input.value = '';
        resultados.classList.remove('abierto');
      }
    }, 250);

    // Evita que el click-fuera-cierra-dropdowns global cierre esto al escribir/hacer clic adentro.
    wrapper.addEventListener("click", function (e) { e.stopPropagation(); });

    input.addEventListener("input", function () {
      // Si el campo no fue enfocado activamente por el usuario (ej. Chrome Autofill silencioso), limpiar y salir
      if (document.activeElement !== input) {
        input.value = '';
        resultados.classList.remove('abierto');
        return;
      }

      const termino = input.value.trim();
      clearTimeout(temporizadorBusquedaGlobal);

      if (termino.length < 2) {
        resultados.classList.remove("abierto");
        return;
      }

      // Con el índice local la respuesta es inmediata (solo se espera a que termine de teclear un instante); sin él, se pregunta al servidor
      temporizadorBusquedaGlobal = setTimeout(function () {
        ejecutarBusquedaGlobal(termino);
      }, indiceBusqueda_.datos ? 60 : 300);
    });

    input.addEventListener("focus", function () {
      if (input.value.trim().length >= 2) resultados.classList.add("abierto");
      cargarIndiceBusqueda_(false); // al enfocar el buscador se renueva el índice por detrás si tiene más de 2 minutos
    });
  }

  function ejecutarBusquedaGlobal(termino) {
    if (indiceBusqueda_.datos) {
      renderizarResultadosBusqueda(buscarEnIndiceLocal_(termino), termino);
      return;
    }
    cargarIndiceBusqueda_(false); // el índice aún no llegó: se pide para las próximas teclas y esta búsqueda se resuelve en el servidor
    google.script.run
      .withSuccessHandler(function (data) { renderizarResultadosBusqueda(data, termino); })
      .withFailureHandler(function (error) {
        console.error("Error en la búsqueda global:", error);
      })
      .buscarGlobal(termino);
  }

  function renderizarResultadosBusqueda(data, termino) {
    const resultados = document.getElementById("navbarSearchResultados");
    if (!resultados) return;

    const hoteles = (data && data.hoteles) || [];
    const carpetas = (data && data.carpetas) || [];

    if (!hoteles.length && !carpetas.length) {
      resultados.innerHTML = '<p class="dropdown-empty-hint">Sin resultados para "' + escaparHtml(termino) + '"</p>';
      resultados.classList.add("abierto");
      return;
    }

    let html = "";

    if (hoteles.length) {
      html += '<p class="busqueda-grupo-titulo">Hoteles</p>';
      html += hoteles.map(function (h) {
        return '<button type="button" class="busqueda-resultado" data-id-hotel="' + h.idHotel + '" data-nombre-hotel="' + escaparHtml(h.nombre) + '">' +
          '<span class="busqueda-resultado-icon">' + ICONO_RESULTADO_HOTEL + '</span>' +
          '<span class="busqueda-resultado-textos"><span class="busqueda-resultado-nombre">' + escaparHtml(h.nombre) + '</span></span>' +
        '</button>';
      }).join("");
    }

    if (carpetas.length) {
      html += '<p class="busqueda-grupo-titulo">Carpetas</p>';
      html += carpetas.map(function (c) {
        return '<button type="button" class="busqueda-resultado" data-id-hotel="' + c.idHotel + '" data-nombre-hotel="' + escaparHtml(c.nombreHotel) + '" data-id-carpeta="' + (c.idCarpeta || '') + '">' +
          '<span class="busqueda-resultado-icon">' + ICONO_RESULTADO_CARPETA + '</span>' +
          '<span class="busqueda-resultado-textos">' +
            '<span class="busqueda-resultado-nombre">' + escaparHtml(c.nombre) + '</span>' +
            '<span class="busqueda-resultado-meta">' + escaparHtml(c.nombreHotel) + '</span>' +
          '</span>' +
        '</button>';
      }).join("");
    }

    resultados.innerHTML = html;
    resultados.classList.add("abierto");

    resultados.querySelectorAll(".busqueda-resultado").forEach(function (btn) {
      btn.addEventListener("click", function () {
        irAHotelDesdeBusqueda(btn.dataset.idHotel, btn.dataset.nombreHotel, btn.dataset.idCarpeta);
        resultados.classList.remove("abierto");
        const input = document.getElementById("navbarSearchInput");
        if (input) input.value = "";
      });
    });
  }

  /** Abre las carpetas del hotel encontrado y sincroniza el resaltado de la sidebar con él. */
  function irAHotelDesdeBusqueda(idHotel, nombreHotel, idCarpeta) {
    const botonSidebar = document.querySelector('.btn-hotel-carpetas[data-hotel-id="' + idHotel + '"]');
    if (botonSidebar) {
      if (typeof seleccionarItemSidebar === "function") seleccionarItemSidebar(botonSidebar);
      const grupo = botonSidebar.closest(".sidebar-group");
      if (grupo) grupo.classList.add("abierto");
    }
    mostrarVistaCarpetasHotel(idHotel, nombreHotel, idCarpeta);
  }
</script>
