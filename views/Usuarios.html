<div class="apartado-container" id="usuariosContainer">
  <div class="apartado-header">
    <div class="apartado-header-texto">
      <h2>Usuarios</h2>
      <p>Quiénes tienen acceso y qué rol tiene cada uno.</p>
    </div>

    <div class="apartado-header-acciones">
      <div class="buscador-apartado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="search" id="inputBuscadorUsuarios" name="q_usuarios" placeholder="Buscar por nombre o correo..." autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" role="searchbox">
      </div>

      <button type="button" class="btn-nuevo-usuario-header" id="btnCrearUsuarioModal" title="Crear nuevo usuario">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Nuevo Usuario</span>
      </button>
    </div>
  </div>

  <div class="usuarios-tabla-contenedor">
    <div class="usuarios-lista-encabezado">
      <span>Nombre</span>
      <span>Correo</span>
      <span>Rol</span>
      <span>Estado</span>
      <span>Acceso Hoteles</span>
      <span style="text-align: right; padding-right: 4px;">Acciones</span>
    </div>

    <div id="usuariosGrid" class="usuarios-lista">
      <div class="apartado-skeleton"></div>
      <div class="apartado-skeleton"></div>
      <div class="apartado-skeleton"></div>
    </div>
  </div>
</div>
