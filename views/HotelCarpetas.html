<div class="hotel-carpetas-container">
  <!-- Header con título, búsqueda y opciones de vista -->
  <div class="hotel-carpetas-header">
    <div class="hotel-carpetas-titulo">
      <h2 id="hotelCarpetasTitulo">AC Hotel by Marriott | Santa Marta - Repositorio de Proyectos</h2>
    </div>

    <div class="hotel-carpetas-controles">
      <div class="buscador-carpetas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="search"
          id="inputBuscadorCarpetas"
          name="q_carpetas"
          class="input-buscar-carpetas"
          placeholder="Buscar carpetas..."
          autocomplete="one-time-code"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore="true"
          data-form-type="other"
          role="searchbox"
        >
      </div>

      <div class="vista-options">
        <button class="vista-btn vista-btn-activo" data-vista="tarjetas" title="Vista de tarjetas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7" height="7" fill="currentColor"/>
            <rect x="14" y="3" width="7" height="7" fill="currentColor"/>
            <rect x="3" y="14" width="7" height="7" fill="currentColor"/>
            <rect x="14" y="14" width="7" height="7" fill="currentColor"/>
          </svg>
        </button>
        <button class="vista-btn" data-vista="filas" title="Vista de filas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>

      <button id="btnNuevaArea" class="btn-nueva-carpeta oculto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
          <line x1="12" y1="11" x2="12" y2="15"></line>
          <line x1="10" y1="13" x2="14" y2="13"></line>
        </svg>
        Nueva Área
      </button>
    </div>
  </div>

  <!-- Grid de carpetas -->
  <div class="hotel-carpetas-content">
    <div id="carpetasListaEncabezado" class="carpetas-lista-encabezado oculto">
      <span></span>
      <span>Nombre</span>
      <span>Elementos</span>
      <span>Tamaño</span>
      <span>Fecha</span>
      <span></span>
    </div>
    <div id="carpetasGrid" class="carpetas-grid carpetas-vista-tarjetas">
      <!-- Las carpetas se cargarán aquí dinámicamente -->
      <div class="carpeta-skeleton"></div>
      <div class="carpeta-skeleton"></div>
      <div class="carpeta-skeleton"></div>
    </div>
  </div>
</div>
