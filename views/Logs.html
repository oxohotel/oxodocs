<div class="apartado-container" id="logsContainer">
  <div class="apartado-header">
    <div class="apartado-header-texto">
      <h2>Logs</h2>
      <p>Historial de acciones: inicios de sesión, cambios de rol, y áreas/carpetas/archivos creados, renombrados o eliminados.</p>
    </div>

    <div class="buscador-apartado">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="search" id="inputBuscadorLogs" name="q_logs" placeholder="Buscar por usuario, acción o descripción..." autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" role="searchbox">
    </div>
  </div>

  <div class="logs-lista-encabezado">
    <span>Fecha</span>
    <span>Usuario</span>
    <span>Acción</span>
    <span>Descripción</span>
    <span>Estado</span>
  </div>

  <div id="logsGrid" class="logs-lista">
    <div class="apartado-skeleton"></div>
    <div class="apartado-skeleton"></div>
    <div class="apartado-skeleton"></div>
  </div>
</div>
