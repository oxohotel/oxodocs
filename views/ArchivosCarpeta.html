<div class="archivos-carpeta-container">
  <!-- Header con breadcrumb -->
  <div class="archivos-header">
    <div class="breadcrumb">
      <button class="btn-volver" id="btnVolverACarpetas" title="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <span class="breadcrumb-item" id="hotelNombreBreadcrumb">Hotel</span>
      <span class="breadcrumb-separator">/</span>
      <span id="rutaCarpetasBreadcrumb"></span>
    </div>

    <h2 id="archivosTitle" class="archivos-titulo">Archivos de la Carpeta</h2>
  </div>

  <!-- Controles -->
  <div class="archivos-controles">
    <div class="buscador-archivos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input
        type="search"
        id="inputBuscadorArchivos"
        name="q_archivos"
        class="input-buscar-archivos"
        placeholder="Buscar archivos..."
        autocomplete="one-time-code"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-lpignore="true"
        data-1p-ignore="true"
        data-form-type="other"
        role="searchbox"
      >
    </div>

    <div class="vista-options">
      <button class="vista-btn vista-btn-activo" data-vista-archivos="tarjetas" title="Vista de tarjetas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" fill="currentColor"/>
          <rect x="14" y="3" width="7" height="7" fill="currentColor"/>
          <rect x="3" y="14" width="7" height="7" fill="currentColor"/>
          <rect x="14" y="14" width="7" height="7" fill="currentColor"/>
        </svg>
      </button>
      <button class="vista-btn" data-vista-archivos="filas" title="Vista de filas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
    </div>

    <button id="btnNuevaCarpeta" class="btn-nueva-carpeta">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
        <line x1="12" y1="11" x2="12" y2="15"></line>
        <line x1="10" y1="13" x2="14" y2="13"></line>
      </svg>
      Nueva Carpeta
    </button>

    <button id="btnSubirArchivos" class="btn-subir-archivo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      Nuevo Archivo
    </button>
  </div>

  <!-- Lista de archivos -->
  <div class="archivos-contenedor">
    <div id="archivosListaEncabezado" class="archivos-lista-encabezado oculto">
      <span></span>
      <span>Nombre</span>
      <span>Fecha</span>
      <span>Tamaño</span>
      <span></span>
    </div>
    <div id="archivosGrid" class="archivos-grid archivos-vista-tarjetas">
      <!-- Los archivos se cargarán aquí dinámicamente -->
      <div class="archivo-skeleton"></div>
      <div class="archivo-skeleton"></div>
      <div class="archivo-skeleton"></div>
    </div>
  </div>
</div>
