<style>
.notification {
  position: fixed;
  top: 24px;
  right: 24px;
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.08);
  animation: notificationSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10000;
  max-width: 360px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  line-height: 1.4;
}

.notification.success {
  background: rgba(229, 243, 235, 0.95);
  color: #1E5C38;
  border: 1px solid #A3D9B8;
}

#vistaHome[data-theme="dark"] .notification.success {
  background: rgba(26, 51, 36, 0.95);
  color: #8FD9A8;
  border: 1px solid #2E5C42;
}

.notification.error {
  background: rgba(254, 235, 236, 0.95);
  color: #9E1F2A;
  border: 1px solid #F5B0B7;
}

#vistaHome[data-theme="dark"] .notification.error {
  background: rgba(60, 20, 24, 0.95);
  color: #F8A5AC;
  border: 1px solid #752830;
}

.notification.info {
  background: rgba(230, 240, 250, 0.95);
  color: #1B4C85;
  border: 1px solid #ABC8E8;
}

#vistaHome[data-theme="dark"] .notification.info {
  background: rgba(24, 44, 64, 0.95);
  color: #96C2F2;
  border: 1px solid #294D70;
}

@keyframes notificationSlideIn {
  from {
    transform: translateX(120%) scale(0.92);
    opacity: 0;
  }
  to {
    transform: translateX(0) scale(1);
    opacity: 1;
  }
}

@keyframes notificationSlideOut {
  from {
    transform: translateX(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateX(120%) scale(0.92);
    opacity: 0;
  }
}

.notification.exit {
  animation: notificationSlideOut 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
</style>
