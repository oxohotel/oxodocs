<script>
  function inicializarSidebar() {
    document.querySelectorAll("[data-toggle-submenu]").forEach(function (boton) {
      boton.addEventListener("click", function (e) {
        e.preventDefault();
        const grupo = boton.closest(".sidebar-group");
        if (!grupo) return;
        const submenu = grupo.querySelector(".sidebar-submenu");
        const abierto = grupo.classList.toggle("abierto");
        if (submenu) submenu.classList.toggle("oculto", !abierto);
      });
    });

    document.querySelectorAll(".sidebar-nav a.sidebar-item").forEach(function (link) {
      link.addEventListener("click", function (e) {
        const destino = link.getAttribute("href");
        if (!destino || destino.charAt(0) !== "#") return;
        const objetivo = document.querySelector(destino);
        if (objetivo) {
          e.preventDefault();
          objetivo.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
  }
</script>
