<style>
/* Shell fijo a la altura del viewport: sidebar y navbar quedan estáticos,
   solo .home-content (dentro de styles/Home.html) hace scroll interno. */
.home-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: var(--home-bg);
  color: var(--home-text);
}

.home-sidebar {
  width: 88px;
  height: 100%;
  background: var(--home-sidebar-bg);
  border-right: 1px solid var(--home-border);
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  white-space: nowrap;
  transition: width 0.3s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.3s ease;
  flex-shrink: 0;
  z-index: 90;
}

.home-sidebar:hover {
  width: 290px;
  box-shadow: var(--home-shadow-md);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px 24px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--home-border);
  transition: padding 0.25s ease;
}

.home-sidebar:hover .sidebar-brand {
  justify-content: flex-start;
  padding: 0 24px 24px;
}

.brand-logo {
  display: block;
  width: auto;
  max-width: 100%;
  height: 42px;
  transition: transform 0.2s ease;
}

.brand-logo:hover {
  transform: scale(1.02);
}

.brand-logo-abierto {
  display: none;
}

.home-sidebar:hover .brand-logo-cerrado {
  display: none;
}

.home-sidebar:hover .brand-logo-abierto {
  display: block;
}

.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  padding: 8px 12px;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}

.sidebar-nav:hover {
  scrollbar-color: var(--home-border) transparent;
}

.sidebar-nav::-webkit-scrollbar {
  width: 5px;
}

.sidebar-nav::-webkit-scrollbar-track {
  background: transparent;
}

.sidebar-nav::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 999px;
}

.sidebar-nav:hover::-webkit-scrollbar-thumb {
  background: var(--home-border);
}

.sidebar-nav:hover::-webkit-scrollbar-thumb:hover {
  background: var(--home-text-muted);
}

/* ==================== TOOLBAR: buscador + expandir/colapsar todo ==================== */
.sidebar-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 12px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  flex-shrink: 0;
  transition: opacity 0.25s ease, max-height 0.3s ease;
}

.home-sidebar:hover .sidebar-toolbar {
  opacity: 1;
  max-height: 70px;
  overflow: visible;
}

.sidebar-buscador {
  flex: 1;
  min-width: 0;
  height: 38px;
  box-sizing: border-box;
  border: 1px solid var(--home-border);
  background: var(--home-bg);
  border-radius: 10px;
  padding: 0 12px;
  font-size: 13px;
  color: var(--home-text);
  outline: none;
  font-weight: 500;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.sidebar-buscador::placeholder {
  color: var(--home-text-muted);
  font-weight: 400;
}

.sidebar-buscador:focus {
  border-color: var(--home-accent-gold);
  box-shadow: 0 0 0 2px var(--home-accent-gold-glow);
}

.sidebar-toolbar-btn {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--home-border);
  background: var(--home-bg);
  border-radius: 10px;
  color: var(--home-text-muted);
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
}

.sidebar-toolbar-btn svg {
  width: 16px;
  height: 16px;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.sidebar-toolbar-btn:hover {
  background: var(--home-active-bg);
  color: var(--home-accent-green);
  border-color: var(--home-accent-green);
  transform: translateY(-1px);
}

.sidebar-toolbar-btn:active {
  transform: scale(0.92);
}

.sidebar-subitem.oculto-filtro {
  display: none;
}

.sidebar-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 12px 14px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--home-text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  position: relative;
  flex-shrink: 0;
  transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
              color 0.2s ease, 
              gap 0.25s ease, 
              transform 0.12s ease;
}

.sidebar-item-modulo {
  background: var(--home-sidebar-bg);
}

.sidebar-group-unico .sidebar-chevron {
  display: none;
}

.home-sidebar:hover .sidebar-item {
  justify-content: flex-start;
  gap: 14px;
}

.sidebar-item:hover {
  background: var(--home-bg);
  color: var(--home-accent-green);
}

.sidebar-item:active {
  transform: scale(0.98);
}

.sidebar-item.active,
.sidebar-group.active > .sidebar-item {
  background: var(--home-active-bg);
  color: var(--home-accent-green);
  font-weight: 700;
}

.sidebar-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease;
}

.sidebar-item:hover .sidebar-icon {
  transform: scale(1.08);
}

.sidebar-icon svg {
  width: 100%;
  height: 100%;
}

.sidebar-label {
  flex: 1;
  text-align: left;
  overflow: hidden;
  opacity: 0;
  letter-spacing: -0.1px;
  transition: opacity 0.25s ease;
}

.home-sidebar:hover .sidebar-label {
  opacity: 1;
}

.home-sidebar:not(:hover) .sidebar-label {
  flex: 0 0 0;
  width: 0;
}

.sidebar-chevron {
  flex-shrink: 0;
  font-size: 11px;
  color: var(--home-text-muted);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
  opacity: 0;
}

.home-sidebar:hover .sidebar-chevron {
  opacity: 1;
}

.home-sidebar:not(:hover) .sidebar-chevron {
  width: 0;
  overflow: hidden;
}

.sidebar-group.abierto .sidebar-chevron {
  transform: rotate(180deg);
  color: var(--home-accent-gold);
}

.sidebar-submenu {
  padding-left: 48px;
  padding-right: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
              opacity 0.25s ease, 
              margin 0.25s ease;
}

.home-sidebar:hover .sidebar-group.abierto .sidebar-submenu {
  max-height: 1400px;
  opacity: 1;
  margin: 4px 0 8px;
  visibility: visible;
}

.home-sidebar:not(:hover) .sidebar-submenu {
  max-height: 0 !important;
  opacity: 0 !important;
  margin: 0 !important;
  visibility: hidden !important;
}

.sidebar-subitem {
  width: 100%;
  border: none;
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--home-text-muted);
  text-decoration: none;
  border-radius: 8px;
  display: block;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
}

.sidebar-subitem:hover {
  background: var(--home-bg);
  color: var(--home-text);
  transform: translateX(3px);
}

.sidebar-subitem:active {
  transform: scale(0.98);
}

.sidebar-subitem.active {
  background: var(--home-active-bg);
  color: var(--home-accent-green);
  font-weight: 700;
}

.sidebar-subitem-vacio {
  color: var(--home-text-muted);
  font-style: italic;
  cursor: default;
  padding: 8px 10px;
}

.sidebar-subitem-vacio:hover {
  background: transparent;
  color: var(--home-text-muted);
  transform: none;
}

.sidebar-divider {
  height: 1px;
  background: var(--home-border);
  margin: 8px 12px;
  flex-shrink: 0;
}

.sidebar-soporte {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 12px;
  padding: 14px;
  border-radius: 14px;
  background: var(--home-bg);
  border: 1px solid var(--home-border);
  transition: gap 0.25s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  cursor: pointer;
}

.sidebar-soporte:hover {
  background: var(--home-active-bg);
  border-color: var(--home-accent-gold);
  transform: translateY(-1px);
}

.home-sidebar:hover .sidebar-soporte {
  justify-content: flex-start;
  gap: 12px;
}

.sidebar-soporte:active {
  transform: scale(0.97);
}

.sidebar-soporte-texto {
  opacity: 0;
  width: 0;
  overflow: hidden;
  transition: opacity 0.25s ease;
}

.home-sidebar:hover .sidebar-soporte-texto {
  opacity: 1;
  width: auto;
}

.soporte-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--home-text);
  white-space: nowrap;
}

.soporte-subtitle {
  font-size: 12px;
  color: var(--home-text-muted);
  white-space: nowrap;
}

@media (max-width: 900px) {
  .home-sidebar {
    display: none;
  }
}
</style>
