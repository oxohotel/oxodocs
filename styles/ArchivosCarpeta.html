.drop-zone {

}

.drop-zone.active {

}

.drop-zone svg {
  color: var(--home-accent-gold);

  height: 44px;
}

.drop-zone h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--home-text);
  margin: 0;
}

.drop-zone p {
  font-size: 13px;
  color: var(--home-text-muted);
  margin: 0;
}

/* Contenedor de archivos */
.archivos-contenedor {
  flex: 1;
}

.archivos-grid {
  display: grid;
  gap: 16px;
  animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.archivos-vista-tarjetas {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}

.archivos-vista-filas {
  grid-template-columns: 1fr;
  gap: 10px;
}

.archivos-lista-encabezado {
  display: grid;
  grid-template-columns: 36px minmax(200px, 1fr) 150px 110px 140px;
  gap: 16px;
  align-items: center;
  padding: 0 20px 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--home-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Tarjeta de archivo */
.archivo-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 24px 16px 18px;
  background: var(--home-card-bg);
  border: 1px solid var(--home-border);
  border-radius: 18px;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), 
              box-shadow 0.22s ease, 
              border-color 0.22s ease;
  position: relative;
  height: 165px;
  box-sizing: border-box;
  justify-content: flex-start;
  box-shadow: var(--home-shadow);
}

.archivo-card:hover {
  border-color: var(--home-accent-gold);
  box-shadow: var(--home-shadow-md), 0 0 16px var(--home-accent-gold-light);
  transform: translateY(-3px);
}

.archivos-grid .archivo-card {
  animation: fadeInUp 0.35s cubic-bezier(0.4, 0, 0.2, 1) backwards;
}

.archivos-grid .archivo-card:nth-child(1) { animation-delay: 0.02s; }
.archivos-grid .archivo-card:nth-child(2) { animation-delay: 0.05s; }
.archivos-grid .archivo-card:nth-child(3) { animation-delay: 0.08s; }
.archivos-grid .archivo-card:nth-child(4) { animation-delay: 0.11s; }
.archivos-grid .archivo-card:nth-child(5) { animation-delay: 0.14s; }
.archivos-grid .archivo-card:nth-child(n+6) { animation-delay: 0.17s; }

.archivo-card-resaltado {
  animation: resaltadoPulso 1.6s ease-out;
}

@keyframes resaltadoPulso {
  0% { box-shadow: 0 0 0 0 var(--home-accent-gold-glow); border-color: var(--home-accent-gold); }
  70% { box-shadow: 0 0 0 12px rgba(196, 151, 43, 0); border-color: var(--home-accent-gold); }
  100% { box-shadow: 0 0 0 0 rgba(196, 151, 43, 0); }
}

.archivo-icon {

  height: 48px;

  object-fit: contain;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.archivo-card:hover .archivo-icon {
  transform: scale(1.08);
}

.archivo-icon.carpeta-icon {

}

.archivo-nombre {

  line-height: 1.35;
}

.archivo-col-fecha,
.archivo-col-tamano {

}

.archivo-col-acciones {

}

/* Vista de filas */
.archivo-card.vista-filas {

}

}

  font-weight: 600;

}

.archivo-card.vista-filas .archivo-col-fecha,
.archivo-card.vista-filas .archivo-col-tamano {

}

.archivo-card.vista-filas .archivo-col-acciones {

}

.archivo-card.vista-filas .archivo-col-acciones .btn-favorito,

.archivo-card.vista-filas .archivo-menu {

}

.btn-gestion-carpeta {

.archivo-card.vista-filas .btn-gestion-carpeta,

.btn-gestion-carpeta:hover {

.btn-gestion-peligro:hover {

}

.archivo-skeleton {

.archivos-vacia {

/* Vista previa archivo */
.archivo-preview-info {
